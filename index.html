<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God's Word for Youth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ══════════════════════════════════════
       WELCOME POPUP (Jesus image + message)
       NOTE: jesus.png must be in the same
       folder as this index.html file
  ══════════════════════════════════════ -->
  <div id="welcome-popup" role="dialog" aria-modal="true" aria-label="Welcome message">
    <div class="welcome-card">
      <img
        class="welcome-image"
        src="jesus.png"
        alt="Jesus with open arms"
      >
      <div class="welcome-body">
        <span class="welcome-icon">🙏</span>
        <p class="welcome-message">
          "I would like to help you<br>with any difficult areas<br>of your life."
        </p>
        <p class="welcome-sub">Come to Me, all who are weary</p>
        <button class="welcome-btn" id="welcome-btn">
          ✦ &nbsp;Enter &amp; Explore
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       VERSE FOCUS OVERLAY (full-screen)
  ══════════════════════════════════════ -->
  <div id="verse-overlay" role="dialog" aria-modal="true" aria-label="Verse focus view">
    <div class="overlay-bg" id="overlay-bg"></div>
    <div class="overlay-blur"></div>
    <div class="overlay-content">
      <span class="overlay-ref" id="overlay-ref"></span>
      <p class="overlay-text" id="overlay-text"></p>
      <button class="overlay-close" id="overlay-close">✕ &nbsp;Close</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       HOME SCREEN
  ══════════════════════════════════════ -->
  <div id="home-screen">

    <!-- Header: cross only, no title text -->
    <header class="app-header">
      <span class="header-cross">✝</span>
    </header>

    <!-- Hero verse -->
    <div class="hero-verse">
      <p>"For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life."</p>
      <span class="hero-ref">John 3:16</span>
    </div>

    <!-- Category grid -->
    <p class="section-label">Browse by topic</p>
    <div class="category-grid" id="category-grid"></div>

  </div>

  <!-- ══════════════════════════════════════
       VERSE PAGE (slide-in)
  ══════════════════════════════════════ -->
  <div id="verse-page" class="page" role="region" aria-label="Verse list">
    <div class="page-header">
      <button class="back-btn" id="back-btn">
        <span>&#8592;</span> Back
      </button>
      <span class="page-icon" id="page-icon"></span>
      <h2 class="page-title" id="page-title"></h2>
    </div>
    <div class="verse-list" id="verse-list"></div>
  </div>

  <script src="verses.js"></script>
  <script src="app.js"></script>
</body>
</html>
