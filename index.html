<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Youth Day Verses – Communion in Action</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══ HOME SCREEN ═══ -->
  <div id="home-screen">

    <header class="app-header">
      <span class="header-cross">✝</span>
      <h1 class="app-title">Youth Day<br>Bible Verses</h1>
      <p class="app-sub">Global Youth Day Service</p>
      <span class="theme-badge">Communion in Action</span>
    </header>

    <div class="hero-verse">
      <p>"For I know the plans I have for you," declares the LORD, "plans to prosper you and not to harm you, plans to give you hope and a future."</p>
      <span class="hero-ref">Jeremiah 29:11 — Key Verse</span>
    </div>

    <p class="section-label">Browse by Category</p>

    <!-- Category index grid — rendered by app.js -->
    <div class="category-grid" id="category-grid"></div>

  </div>

  <!-- ═══ VERSE PAGE (shell — filled by app.js) ═══ -->
  <div class="page" id="verse-page">
    <div class="page-header">
      <button class="back-btn" id="back-btn">← Back</button>
      <span class="page-icon" id="page-icon"></span>
      <h2 class="page-title" id="page-title"></h2>
    </div>
    <div class="verse-list" id="verse-list"></div>
  </div>

  <script src="data/verses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
